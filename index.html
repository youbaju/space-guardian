<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>حارس السماء</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; margin:0; padding:0; }
  html, body {
    height:100%; width:100%; overflow:hidden;
    font-family: 'Tahoma', 'Segoe UI', sans-serif;
    color: #f5e6d0;
    touch-action: none;
    background: #05070f;
  }
  #app{ position:relative; height:100%; width:100%; }
  canvas{ position:absolute; top:0; left:0; display:block; }
  #hud{
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:center;
    padding: 14px 18px;
    z-index:5;
    pointer-events:none;
    font-size: 15px;
    font-weight:bold;
  }
  #hud .left, #hud .right{ display:flex; gap:14px; align-items:center; }
  #lives{ color:#ff6b6b; letter-spacing:2px; }
  #levelLabel{ color:#7ec8ff; }
  #scoreLabel{ color:#f0c878; }
  #overlay{
    position:absolute; inset:0;
    background: rgba(5,7,15,0.95);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index: 20;
    text-align:center;
    padding: 0 24px;
  }
  #overlay .icon{ font-size: 48px; margin-bottom: 8px; }
  #overlay h1, #overlay h2{ font-size: 24px; color: #7ec8ff; margin-bottom: 8px; }
  #overlay p{ font-size: 14px; opacity: 0.85; margin: 4px 0 20px 0; max-width: 320px; line-height:1.6; }
  .btn{
    background: linear-gradient(180deg, #7ec8ff, #3a8fd0);
    color: #05070f;
    border:none;
    padding: 13px 38px;
    font-size: 16px;
    font-weight:bold;
    border-radius: 28px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    margin: 4px;
  }
  .btn.secondary{
    background: transparent;
    color: #7ec8ff;
    border: 2px solid rgba(126,200,255,0.5);
  }
  .btn:active{ transform: scale(0.96); }
  #levelGrid{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin: 10px 0 22px 0;
    max-width: 320px;
  }
  .levelBtn{
    background: rgba(126,200,255,0.12);
    border: 1.5px solid rgba(126,200,255,0.35);
    color: #7ec8ff;
    padding: 12px 0;
    border-radius: 10px;
    font-size: 15px;
    font-weight:bold;
  }
  .levelBtn.locked{
    opacity: 0.35;
    border-color: rgba(255,255,255,0.15);
    color: #888;
  }
  .levelBtn:active{ transform: scale(0.94); }
  #tapzone{ position:absolute; inset:0; z-index: 10; }
  #bossBar{
    position:absolute;
    top: 54px; left: 50%;
    transform: translateX(-50%);
    width: 70%;
    max-width: 320px;
    height: 10px;
    background: rgba(255,255,255,0.15);
    border-radius: 6px;
    overflow:hidden;
    z-index: 6;
    display:none;
  }
  #bossBarFill{
    height:100%;
    width:100%;
    background: linear-gradient(90deg, #ff6b6b, #ff9b6b);
    transition: width 0.15s ease;
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="canvas"></canvas>
  <div id="hud">
    <span class="left"><span id="scoreLabel">0</span></span>
    <span class="right">
      <span id="levelLabel">مرحلة 1</span>
      <span id="lives">❤❤❤</span>
    </span>
  </div>
  <div id="bossBar"><div id="bossBarFill"></div></div>
  <div id="tapzone"></div>

  <div id="overlay">
    <div class="icon">🚀</div>
    <h1>حارس السماء</h1>
    <p>اسحب إصبعك يمين ويسار عشان تحرك السفينة. الإطلاق تلقائي. تفادى واقضِ على الأعداء قبل ما يوصلون لك!</p>
    <div id="levelGrid"></div>
    <button class="btn" id="playBtn">ابدأ من مرحلة 1</button>
  </div>
</div>

<script>
(function(){
  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var W, H, DPR;

  var scoreLabel = document.getElementById('scoreLabel');
  var levelLabel = document.getElementById('levelLabel');
  var livesEl = document.getElementById('lives');
  var overlay = document.getElementById('overlay');
  var playBtn = document.getElementById('playBtn');
  var levelGrid = document.getElementById('levelGrid');
  var tapzone = document.getElementById('tapzone');
  var bossBar = document.getElementById('bossBar');
  var bossBarFill = document.getElementById('bossBarFill');

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W*DPR; canvas.height = H*DPR;
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- Audio ----
  var audioCtx = null;
  function ensureAudio(){
    if (!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if (audioCtx && audioCtx.state==='suspended') audioCtx.resume();
  }
  function beep(freq,dur,type,vol){
    if (!audioCtx) return;
    var o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(vol||0.1, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+dur);
  }
  function sfxShoot(){ beep(880,0.05,'square',0.05); }
  function sfxHit(){ beep(300,0.08,'triangle',0.1); }
  function sfxExplode(){ beep(140,0.22,'sawtooth',0.12); }
  function sfxLevelUp(){ beep(500,0.1,'triangle',0.12); setTimeout(function(){beep(750,0.14,'triangle',0.12);},100); }
  function sfxLose(){ beep(200,0.3,'sine',0.12); osc2Fail(); }
  function osc2Fail(){
    if(!audioCtx) return;
    var o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(160,audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(50,audioCtx.currentTime+0.4);
    g.gain.setValueAtTime(0.12,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.4);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+0.4);
  }
  function vibrate(ms){ if(navigator.vibrate) navigator.vibrate(ms); }

  // ---- Level definitions ----
  var LEVELS = [
    { rows:2, cols:5, enemySpeed:40, dropSpeed:14, fireChance:0.0025, boss:false,
      bg1:'#05070f', bg2:'#0d1a33', enemyColor:'#7ec8ff', enemyAccent:'#c9e8ff', name:'حزام النجوم' },
    { rows:3, cols:5, enemySpeed:50, dropSpeed:16, fireChance:0.003, boss:false,
      bg1:'#0a0518', bg2:'#2a1040', enemyColor:'#b06bff', enemyAccent:'#e0c2ff', name:'سحابة الغبار' },
    { rows:3, cols:6, enemySpeed:60, dropSpeed:18, fireChance:0.0035, boss:false,
      bg1:'#03120c', bg2:'#0a3324', enemyColor:'#4ae08a', enemyAccent:'#baffd6', name:'حقل النيازك' },
    { rows:3, cols:6, enemySpeed:70, dropSpeed:20, fireChance:0.004, boss:false,
      bg1:'#180505', bg2:'#3a0f0f', enemyColor:'#ff8a5b', enemyAccent:'#ffd0b3', name:'المدار الأحمر' },
    { rows:0, cols:0, enemySpeed:0, dropSpeed:0, fireChance:0, boss:true, bossHp:40, bossSpeed:110,
      bg1:'#0d0208', bg2:'#3a0518', enemyColor:'#ff3b5c', enemyAccent:'#ffb1c2', name:'وكر الزعيم' }
  ];
  var TOTAL_LEVELS = LEVELS.length;

  var unlocked = 1;
  try { unlocked = parseInt(localStorage.getItem('hs_unlocked')||'1',10) || 1; } catch(e){}
  var bestScore = 0;
  try { bestScore = parseInt(localStorage.getItem('hs_best')||'0',10) || 0; } catch(e){}

  function buildLevelGrid(){
    levelGrid.innerHTML = '';
    for (var i=1;i<=TOTAL_LEVELS;i++){
      var b = document.createElement('button');
      b.className = 'levelBtn' + (i>unlocked ? ' locked' : '');
      b.textContent = (LEVELS[i-1].boss ? '👑' : i);
      b.dataset.level = i;
      if (i<=unlocked){
        b.addEventListener('click', function(e){
          var lvl = parseInt(e.target.dataset.level,10);
          startLevel(lvl);
        });
      }
      levelGrid.appendChild(b);
    }
  }
  buildLevelGrid();

  // ---- Game state ----
  var ship, bullets, enemyBullets, enemies, particles;
  var currentLevel = 1;
  var lives = 3;
  var score = 0;
  var running = false;
  var rafId = null, lastTime = null;
  var fireTimer = 0;
  var levelCfg = null;
  var boss = null;
  var dragging = false;
  var stars = [];

  for (var s=0;s<40;s++){
    stars.push({x:Math.random(), y:Math.random(), speed: 20+Math.random()*40, size: 1+Math.random()*1.5});
  }

  function resetShip(){
    ship = { x: W/2, y: H-70, w: 34, h: 34, speed: 0 };
  }

  function spawnEnemies(cfg){
    enemies = [];
    var marginX = 40;
    var gapX = (W - marginX*2) / cfg.cols;
    var startY = 70;
    var gapY = 46;
    for (var r=0;r<cfg.rows;r++){
      for (var c=0;c<cfg.cols;c++){
        enemies.push({
          x: marginX + gapX*c + gapX/2,
          y: startY + gapY*r,
          w: 26, h: 20,
          alive: true,
          hp: 1
        });
      }
    }
  }

  function startLevel(lvl){
    ensureAudio();
    currentLevel = lvl;
    levelCfg = LEVELS[lvl-1];
    lives = 3;
    score = 0;
    bullets = []; enemyBullets = []; particles = [];
    resetShip();
    fireTimer = 0;
    boss = null;

    if (levelCfg.boss){
      boss = { x: W/2, y: 110, w: 90, h: 60, hp: levelCfg.bossHp, maxHp: levelCfg.bossHp, dir:1, speed: levelCfg.bossSpeed, fireTimer:0 };
      bossBar.style.display = 'block';
      bossBarFill.style.width = '100%';
      enemies = [];
    } else {
      bossBar.style.display = 'none';
      spawnEnemies(levelCfg);
    }

    levelLabel.textContent = 'مرحلة ' + lvl + (levelCfg.boss ? ' 👑' : '') + ' — ' + levelCfg.name;
    updateHud();
    overlay.style.display = 'none';
    running = true;
    lastTime = null;
    rafId = requestAnimationFrame(loop);
  }

  function updateHud(){
    scoreLabel.textContent = score;
    var hearts = '';
    for (var i=0;i<3;i++) hearts += (i<lives ? '❤' : '🖤');
    livesEl.textContent = hearts;
  }

  // ---- Input: horizontal drag ----
  var lastTouchX = null;
  tapzone.addEventListener('touchstart', function(e){
    ensureAudio();
    dragging = true;
    lastTouchX = e.touches[0].clientX;
  }, {passive:true});
  tapzone.addEventListener('touchmove', function(e){
    if (!dragging || !running) return;
    var x = e.touches[0].clientX;
    var dx = x - lastTouchX;
    lastTouchX = x;
    ship.x = Math.max(ship.w/2, Math.min(W-ship.w/2, ship.x + dx));
  }, {passive:true});
  tapzone.addEventListener('touchend', function(){ dragging=false; }, {passive:true});

  tapzone.addEventListener('mousedown', function(e){ ensureAudio(); dragging=true; lastTouchX=e.clientX; });
  window.addEventListener('mousemove', function(e){
    if (!dragging || !running) return;
    var dx = e.clientX - lastTouchX;
    lastTouchX = e.clientX;
    ship.x = Math.max(ship.w/2, Math.min(W-ship.w/2, ship.x + dx));
  });
  window.addEventListener('mouseup', function(){ dragging=false; });

  function loop(ts){
    if (!running) return;
    if (lastTime===null) lastTime = ts;
    var dt = Math.min((ts-lastTime)/1000, 0.05);
    lastTime = ts;

    update(dt);
    draw();

    rafId = requestAnimationFrame(loop);
  }

  function update(dt){
    // stars
    for (var si=0; si<stars.length; si++){
      stars[si].y += stars[si].speed * dt / H;
      if (stars[si].y > 1) stars[si].y = 0;
    }

    // auto fire
    fireTimer -= dt;
    if (fireTimer <= 0){
      fireTimer = 0.28;
      bullets.push({ x: ship.x, y: ship.y - ship.h/2, w:3, h:12, speed: 480 });
      sfxShoot();
    }

    // bullets
    for (var i=bullets.length-1;i>=0;i--){
      bullets[i].y -= bullets[i].speed*dt;
      if (bullets[i].y < -20) bullets.splice(i,1);
    }
    for (var j=enemyBullets.length-1;j>=0;j--){
      enemyBullets[j].y += enemyBullets[j].speed*dt;
      if (enemyBullets[j].y > H+20) enemyBullets.splice(j,1);
    }

    // particles
    for (var p=particles.length-1;p>=0;p--){
      var pt = particles[p];
      pt.life -= dt; pt.x += pt.vx*dt; pt.y += pt.vy*dt;
      if (pt.life<=0) particles.splice(p,1);
    }

    if (levelCfg && levelCfg.boss){
      updateBoss(dt);
    } else {
      updateEnemies(dt);
    }

    checkCollisions();
  }

  var enemyDir = 1;
  function updateEnemies(dt){
    var hitEdge = false;
    for (var i=0;i<enemies.length;i++){
      var e = enemies[i];
      if (!e.alive) continue;
      e.x += enemyDir * levelCfg.enemySpeed * dt;
      if (e.x < 20 || e.x > W-20) hitEdge = true;

      if (Math.random() < levelCfg.fireChance){
        enemyBullets.push({x:e.x, y:e.y+12, w:3, h:10, speed:220});
      }
    }
    if (hitEdge){
      enemyDir *= -1;
      for (var k=0;k<enemies.length;k++){
        if (enemies[k].alive) enemies[k].y += levelCfg.dropSpeed;
      }
    }

    var anyAlive = enemies.some(function(e){return e.alive;});
    if (!anyAlive){
      levelComplete();
    }

    // enemy reaches ship line -> lose a life instantly (danger)
    for (var m=0;m<enemies.length;m++){
      if (enemies[m].alive && enemies[m].y > ship.y - 20){
        loseLife();
        enemies[m].alive = false;
        spawnBoom(enemies[m].x, enemies[m].y);
      }
    }
  }

  function updateBoss(dt){
    boss.x += boss.dir * boss.speed * dt;
    if (boss.x < 70 || boss.x > W-70) boss.dir *= -1;

    boss.fireTimer -= dt;
    if (boss.fireTimer <= 0){
      boss.fireTimer = 0.9;
      enemyBullets.push({x:boss.x-20, y:boss.y+30, w:4, h:12, speed:250});
      enemyBullets.push({x:boss.x+20, y:boss.y+30, w:4, h:12, speed:250});
    }

    bossBarFill.style.width = Math.max(0,(boss.hp/boss.maxHp*100)) + '%';
  }

  function checkCollisions(){
    // player bullets vs enemies
    for (var i=bullets.length-1;i>=0;i--){
      var b = bullets[i];
      if (levelCfg.boss && boss){
        if (Math.abs(b.x-boss.x) < boss.w/2 && Math.abs(b.y-boss.y) < boss.h/2){
          boss.hp -= 1;
          bullets.splice(i,1);
          sfxHit();
          spawnBoom(b.x,b.y,4);
          if (boss.hp<=0){
            spawnBoom(boss.x, boss.y, 30);
            boss = null;
            sfxExplode();
            levelComplete();
          }
          continue;
        }
      } else {
        for (var j=0;j<enemies.length;j++){
          var e = enemies[j];
          if (!e.alive) continue;
          if (Math.abs(b.x-e.x) < e.w/2 && Math.abs(b.y-e.y) < e.h/2){
            e.alive = false;
            bullets.splice(i,1);
            score += 10;
            sfxHit();
            spawnBoom(e.x,e.y);
            updateHud();
            break;
          }
        }
      }
    }

    // enemy bullets vs ship
    for (var k=enemyBullets.length-1;k>=0;k--){
      var eb = enemyBullets[k];
      if (Math.abs(eb.x-ship.x) < ship.w/2 && Math.abs(eb.y-ship.y) < ship.h/2){
        enemyBullets.splice(k,1);
        loseLife();
        spawnBoom(ship.x, ship.y, 10);
      }
    }

    // boss body collision with ship (rare but possible)
    if (levelCfg.boss && boss){
      if (Math.abs(boss.x-ship.x) < (boss.w/2+ship.w/2) && Math.abs(boss.y-ship.y) < (boss.h/2+ship.h/2)){
        loseLife();
      }
    }
  }

  function spawnBoom(x,y,count){
    count = count||8;
    for (var i=0;i<count;i++){
      var ang = Math.random()*Math.PI*2;
      var sp = 40+Math.random()*90;
      particles.push({x:x,y:y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,life:0.4+Math.random()*0.3, color: Math.random()<0.5?'#ff9b6b':'#ffe08a', size:2+Math.random()*2});
    }
  }

  function loseLife(){
    lives -= 1;
    updateHud();
    vibrate(60);
    if (lives<=0){
      gameOver(false);
    }
  }

  function levelComplete(){
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    sfxLevelUp();
    vibrate([10,40,10]);

    if (currentLevel >= unlocked && currentLevel < TOTAL_LEVELS){
      unlocked = currentLevel+1;
      try{ localStorage.setItem('hs_unlocked', String(unlocked)); }catch(e){}
    }
    if (score > bestScore){
      bestScore = score;
      try{ localStorage.setItem('hs_best', String(bestScore)); }catch(e){}
    }

    showOverlay('icon-win', currentLevel>=TOTAL_LEVELS ? '🏆 أنهيت كل المراحل!' : '✅ اجتزت المرحلة ' + currentLevel,
      'نتيجتك: ' + score,
      currentLevel<TOTAL_LEVELS ? [{text:'المرحلة التالية', action:function(){ startLevel(currentLevel+1); }}] : [],
      true);
  }

  function gameOver(won){
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    sfxLose();
    vibrate(150);

    if (score > bestScore){
      bestScore = score;
      try{ localStorage.setItem('hs_best', String(bestScore)); }catch(e){}
    }

    showOverlay('💥', 'انتهت المحاولة', 'نتيجتك: ' + score + ' — أفضل نتيجة: ' + bestScore,
      [{text:'أعد المحاولة', action:function(){ startLevel(currentLevel); }}], true);
  }

  function showOverlay(icon, title, desc, extraButtons, showLevels){
    overlay.querySelector('.icon').textContent = icon;
    overlay.querySelector('h1').textContent = title;
    overlay.querySelector('p').textContent = desc;
    bossBar.style.display = 'none';

    // rebuild buttons area
    var oldExtra = document.getElementById('extraBtns');
    if (oldExtra) oldExtra.remove();
    var wrap = document.createElement('div');
    wrap.id = 'extraBtns';
    (extraButtons||[]).forEach(function(eb){
      var btn = document.createElement('button');
      btn.className = 'btn';
      btn.textContent = eb.text;
      btn.addEventListener('click', eb.action);
      wrap.appendChild(btn);
    });
    var backBtn = document.createElement('button');
    backBtn.className = 'btn secondary';
    backBtn.textContent = 'قائمة المراحل';
    backBtn.addEventListener('click', function(){
      buildLevelGrid();
      levelGrid.style.display = 'grid';
      playBtn.style.display = 'inline-block';
      wrap.style.display = 'none';
      overlay.querySelector('.icon').textContent = '🚀';
      overlay.querySelector('h1').textContent = 'حارس السماء';
      overlay.querySelector('p').textContent = 'اسحب إصبعك يمين ويسار عشان تحرك السفينة. الإطلاق تلقائي. تفادى واقضِ على الأعداء قبل ما يوصلون لك!';
      playBtn.textContent = 'ابدأ من مرحلة 1';
    });
    wrap.appendChild(backBtn);

    overlay.insertBefore(wrap, playBtn);
    playBtn.style.display = 'none';
    levelGrid.style.display = 'none';
    overlay.style.display = 'flex';
  }

  playBtn.addEventListener('click', function(){ startLevel(1); });

  function draw(){
    var top = (levelCfg && levelCfg.bg1) || '#05070f';
    var bot = (levelCfg && levelCfg.bg2) || '#05070f';
    var grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0, top);
    grad.addColorStop(1, bot);
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    ctx.save();
    ctx.fillStyle = '#ffffff';
    for (var i=0;i<stars.length;i++){
      ctx.globalAlpha = 0.5;
      ctx.fillRect(stars[i].x*W, stars[i].y*H, stars[i].size, stars[i].size);
    }
    ctx.restore();

    // ship
    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.fillStyle = '#7ec8ff';
    ctx.beginPath();
    ctx.moveTo(0,-ship.h/2);
    ctx.lineTo(ship.w/2, ship.h/2);
    ctx.lineTo(0, ship.h/3);
    ctx.lineTo(-ship.w/2, ship.h/2);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // bullets
    ctx.fillStyle = '#f0c878';
    bullets.forEach(function(b){ ctx.fillRect(b.x-b.w/2, b.y-b.h/2, b.w, b.h); });
    ctx.fillStyle = '#ff6b6b';
    enemyBullets.forEach(function(b){ ctx.fillRect(b.x-b.w/2, b.y-b.h/2, b.w, b.h); });

    // enemies or boss
    if (levelCfg && levelCfg.boss && boss){
      ctx.save();
      ctx.translate(boss.x, boss.y);
      // outer wing shape
      ctx.fillStyle = levelCfg.enemyColor;
      ctx.beginPath();
      ctx.moveTo(-boss.w/2, 0);
      ctx.lineTo(-boss.w/2+18, -boss.h/2);
      ctx.lineTo(boss.w/2-18, -boss.h/2);
      ctx.lineTo(boss.w/2, 0);
      ctx.lineTo(boss.w/2-18, boss.h/2);
      ctx.lineTo(-boss.w/2+18, boss.h/2);
      ctx.closePath();
      ctx.fill();
      // core
      ctx.fillStyle = levelCfg.enemyAccent;
      ctx.beginPath();
      ctx.arc(0, 0, 14, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#2a0510';
      ctx.beginPath();
      ctx.arc(0, 0, 6, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    } else if (enemies){
      var eColor = (levelCfg && levelCfg.enemyColor) || '#9b6bff';
      var eAccent = (levelCfg && levelCfg.enemyAccent) || '#d6c2ff';
      enemies.forEach(function(e){
        if (!e.alive) return;
        ctx.save();
        ctx.fillStyle = eColor;
        roundRect(ctx, e.x-e.w/2, e.y-e.h/2, e.w, e.h, 5);
        ctx.fill();
        ctx.fillStyle = eAccent;
        ctx.beginPath();
        ctx.arc(e.x, e.y, 3, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
      });
    }

    // particles
    particles.forEach(function(p){
      ctx.save();
      ctx.globalAlpha = Math.max(p.life,0)*2;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    });
  }

  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  resetShip();
  draw();
})();
</script>
